<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Toper.uz — shaxsiy suhbat">
<meta name="theme-color" content="#6757e8">
<title>Toper.uz — Bizning suhbat</title>
<style>
:root{
  --primary:#6757e8;--primary2:#7b6df2;--bg:#f6f7fc;--text:#172033;
  --muted:#8a93a7;--border:#e8eaf1;--green:#27c768;--danger:#e5484d;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:Inter,Arial,sans-serif;color:var(--text);background:var(--bg)}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* LOGIN */
#loginScreen{height:100dvh;display:flex;align-items:center;justify-content:center;padding:18px;background:linear-gradient(135deg,#6251e6,#8a7cf2)}
.loginBox{width:min(390px,100%);background:#fff;border-radius:26px;padding:32px 24px;box-shadow:0 25px 70px #1e164c35;text-align:center}
.logo{width:70px;height:70px;border-radius:21px;margin:0 auto 16px;display:grid;place-items:center;color:#fff;font-size:32px;font-weight:800;background:linear-gradient(145deg,#745cf2,#5544d8)}
.loginBox h1{font-size:28px;margin-bottom:7px}.loginBox p{color:#7d8699;margin-bottom:24px}
.loginBox input{width:100%;height:52px;border:1px solid #dfe2ea;border-radius:15px;padding:0 16px;outline:none;margin-bottom:9px}
.loginBox input:focus{border-color:var(--primary);box-shadow:0 0 0 3px #6757e815}
.primary{width:100%;height:52px;border:0;border-radius:15px;background:var(--primary);color:#fff;font-weight:700}
.error{height:20px;color:var(--danger);font-size:13px;margin-bottom:3px}

/* APP */
#chatScreen{height:100dvh;width:100%;max-width:1180px;margin:auto;background:#fff;display:flex;flex-direction:column}
.header{height:76px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--border);background:#fff;z-index:3}
.brand{display:flex;align-items:center;gap:12px}
.brandIcon{width:48px;height:48px;border-radius:16px;background:linear-gradient(145deg,#735ef1,#5543d8);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:800;box-shadow:0 8px 18px #6757e825}
.brandText b{display:block;font-size:18px}.status{display:flex;align-items:center;gap:6px;margin-top:3px;color:#788298;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:#c3c8d2}.dot.online{background:var(--green);box-shadow:0 0 0 3px #27c76818}
.logout{border:0;background:#fff0f2;color:#c53e4a;padding:10px 15px;border-radius:13px;font-weight:600}
.messages{flex:1;overflow-y:auto;padding:24px 22px 18px;background-color:#f7f8fc;background-image:radial-gradient(#dfe3f0 1px,transparent 1px);background-size:25px 25px;scroll-behavior:smooth}
.day{text-align:center;color:#9aa2b4;font-size:11px;margin:2px 0 18px}
.msgRow{display:flex;margin-bottom:12px;align-items:flex-end;gap:8px}.msgRow.mine{justify-content:flex-end}
.avatar{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#7564ed,#5545d7);color:#fff;font-size:13px;font-weight:700}
.bubble{max-width:min(75%,520px);padding:10px 12px;border-radius:18px;background:#fff;box-shadow:0 4px 15px #25304b0b;border:1px solid #edf0f6;position:relative}
.mine .bubble{background:linear-gradient(145deg,#7462ee,#6251e5);color:#fff;border:0;border-bottom-right-radius:6px}
.other .bubble{border-bottom-left-radius:6px}
.name{font-size:11px;font-weight:700;color:var(--primary);margin-bottom:4px}.mine .name{color:#eceaff}
.text{white-space:pre-wrap;word-break:break-word;line-height:1.45;font-size:15px}
.time{font-size:10px;color:#9aa2b4;text-align:right;margin-top:5px}.mine .time{color:#ddd8ff}
.photo{display:block;max-width:280px;max-height:350px;border-radius:13px;cursor:pointer;object-fit:cover;margin-bottom:4px}
.actions{display:flex;justify-content:flex-end;margin-top:5px}.deleteBtn{border:0;background:transparent;color:#8b94a8;font-size:10px;padding:1px}.mine .deleteBtn{color:#eceaff}
.typing{height:24px;padding-left:66px;color:#7e879c;font-size:12px;display:flex;align-items:center;gap:6px}
.typingDots{display:inline-flex;gap:3px}.typingDots i{width:5px;height:5px;border-radius:50%;background:#9da5b8;animation:bounce 1s infinite}.typingDots i:nth-child(2){animation-delay:.15s}.typingDots i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}}
.empty{text-align:center;color:#9ca4b5;padding-top:18vh;font-size:14px}
.composerWrap{flex:none;background:#fff;border-top:1px solid var(--border);padding:10px 16px 5px}
.composer{display:flex;align-items:center;gap:9px}
.composer input[type=text]{flex:1;min-width:0;height:48px;border:1px solid #dfe3ec;border-radius:16px;padding:0 15px;outline:none;background:#fafbfe}
.composer input[type=text]:focus{border-color:var(--primary);background:#fff}
.iconBtn{width:48px;height:48px;border:0;border-radius:15px;background:#f0f1f7;display:grid;place-items:center;font-size:19px}
.send{background:linear-gradient(145deg,#7563f0,#5947db);color:#fff;font-size:21px;box-shadow:0 7px 15px #6757e82c}
.footer{text-align:center;color:#9ca4b7;font-size:11px;padding:5px 0 2px}

/* MODALS */
.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modalBox{width:min(340px,100%);background:#fff;border-radius:20px;padding:22px;text-align:center}.modalBox h3{margin-bottom:8px}.modalBox p{color:#788195;font-size:13px;margin-bottom:18px}
.modalBtns{display:flex;gap:8px}.modalBtns button{flex:1;height:44px;border:0;border-radius:12px}.cancel{background:#eef0f5}.danger{background:var(--danger);color:#fff}
.imageModal img{max-width:95vw;max-height:88vh;border-radius:15px}

/* MOBILE */
@media(max-width:650px){
 .header{height:66px;padding:0 12px}.brandIcon{width:42px;height:42px;border-radius:14px}.brandText b{font-size:16px}.status{font-size:11px}
 .logout{padding:9px 11px;font-size:12px}.messages{padding:17px 10px}.bubble{max-width:84%}.avatar{width:30px;height:30px}
 .photo{max-width:220px;max-height:300px}.composerWrap{padding:8px 8px 4px}.composer input[type=text]{height:46px}.iconBtn{width:44px;height:46px;border-radius:14px}
}
</style>
</head>
<body>

<section id="loginScreen">
  <div class="loginBox">
    <div class="logo">T</div>
    <h1>Toper.uz</h1>
    <p>Kiyimlar sotib olish</p>
    <div id="pinStep">
      <input id="pinInput" type="password" inputmode="numeric" maxlength="4" placeholder="4 xonali kod" autocomplete="off">
      <div id="pinError" class="error"></div>
      <button class="primary" id="pinBtn">Kirish</button>
    </div>
    <div id="nameStep" class="hidden">
      <input id="nameInput" type="text" maxlength="30" placeholder="Ismingiz" autocomplete="off">
      <div id="nameError" class="error"></div>
      <button class="primary" id="nameBtn">Sotib Olish</button>
    </div>
  </div>
</section>

<section id="chatScreen" class="hidden">
  <header class="header">
    <div class="brand">
      <div class="brandIcon">T</div>
      <div class="brandText">
        <b>Toper.uz</b>
        <div class="status"><span id="statusDot" class="dot"></span><span id="onlineText">Ulanmoqda...</span></div>
      </div>
    </div>
    <button class="logout" id="logoutBtn">Chiqish</button>
  </header>

  <main id="messages" class="messages">
    <div id="empty" class="empty">Hozircha xabar yo‘q</div>
  </main>

  <div id="typingBox" class="typing hidden">
    <span id="typingName"></span>
    <span>yozmoqda</span>
    <span class="typingDots"><i></i><i></i><i></i></span>
  </div>

  <div class="composerWrap">
    <div class="composer">
      <label class="iconBtn" title="Rasm yuborish" style="cursor:pointer">
        📷<input id="imageInput" type="file" accept="image/*" hidden>
      </label>
      <input id="messageInput" type="text" placeholder="Xabar yozing..." autocomplete="off">
      <button class="iconBtn send" id="sendBtn" title="Yuborish">➤</button>
    </div>
    <div class="footer">Murodjon yaratgan ♥</div>
  </div>
</section>

<div id="deleteModal" class="modal hidden">
  <div class="modalBox">
    <h3>Xabarni o‘chirasizmi?</h3><p>Bu xabar chatdan o‘chiriladi.</p>
    <div class="modalBtns"><button class="cancel" id="cancelDelete">Bekor qilish</button><button class="danger" id="confirmDelete">O‘chirish</button></div>
  </div>
</div>
<div id="imageModal" class="modal imageModal hidden"><img id="bigImage" alt="Rasm"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getDatabase,ref,push,onValue,onDisconnect,set,remove,onValue as onValue2} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

const firebaseConfig={
 apiKey:"AIzaSyAV7jDmCi89XU3-xLpk_WRU_mXbFcAK_qY",
 authDomain:"kiyimlar-olamiz-uz.firebaseapp.com",
 databaseURL:"https://kiyimlar-olamiz-uz-default-rtdb.firebaseio.com",
 projectId:"kiyimlar-olamiz-uz",
 storageBucket:"kiyimlar-olamiz-uz.firebasestorage.app",
 messagingSenderId:"721401033200",
 appId:"1:721401033200:web:d543e11684bfdb39fa2d35"
};

const ACCESS_CODE="0906";
const ONE_HOUR=60*60*1000;
const ROOM="bizning-suhbat-2026";
const MESSAGES_PATH=`rooms/${ROOM}/messages`;
const PRESENCE_PATH=`rooms/${ROOM}/presence`;

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);
const messagesRef=ref(db,MESSAGES_PATH);
const presenceRef=ref(db,PRESENCE_PATH);

const $=id=>document.getElementById(id);
const loginScreen=$("loginScreen"),chatScreen=$("chatScreen");
const pinStep=$("pinStep"),nameStep=$("nameStep");
const pinInput=$("pinInput"),nameInput=$("nameInput");
const pinError=$("pinError"),nameError=$("nameError");
const messagesBox=$("messages"),empty=$("empty"),messageInput=$("messageInput"),imageInput=$("imageInput");
const typingBox=$("typingBox"),typingName=$("typingName"),onlineText=$("onlineText"),statusDot=$("statusDot");

let currentUsername="";
let currentKey="";
let messagesCache={};
let presenceCache={};
let typingTimer=null;
let pendingDelete=null;

function normalize(id,m){
 return {id,author:m?.author??m?.sender??"",timestamp:Number(m?.timestamp??m?.createdAt??0),text:m?.text??"",image:m?.image??""};
}
function showPin(){
 loginScreen.classList.remove("hidden");chatScreen.classList.add("hidden");
 pinStep.classList.remove("hidden");nameStep.classList.add("hidden");
 pinInput.value="";pinError.textContent="";
 setTimeout(()=>pinInput.focus(),100);
}
function enterChat(){
 loginScreen.classList.add("hidden");chatScreen.classList.remove("hidden");
 messageInput.focus();setupPresence();
}
function pinLogin(){
 if(pinInput.value!==ACCESS_CODE){
  pinError.textContent="Kod noto‘g‘ri. Faqat 0906 kiriting.";
  pinInput.value="";pinInput.focus();return;
 }
 pinError.textContent="";
 const saved=localStorage.getItem("toper_username");
 if(saved){currentUsername=saved;enterChat()}
 else{pinStep.classList.add("hidden");nameStep.classList.remove("hidden");nameInput.focus()}
}
function nameLogin(){
 const name=nameInput.value.trim();
 if(name.length<2){nameError.textContent="Ism kamida 2 ta belgidan iborat bo‘lsin.";return}
 currentUsername=name;localStorage.setItem("toper_username",name);enterChat();
}
$("pinBtn").onclick=pinLogin;$("nameBtn").onclick=nameLogin;
pinInput.onkeydown=e=>{if(e.key==="Enter")pinLogin()};nameInput.onkeydown=e=>{if(e.key==="Enter")nameLogin()};
messageInput.onkeydown=e=>{if(e.key==="Enter")sendMessage()};

function setupPresence(){
 if(!currentUsername)return;
 currentKey=sessionStorage.getItem("toper_presence_key");
 if(!currentKey){currentKey=crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);sessionStorage.setItem("toper_presence_key",currentKey)}
 const mine=ref(db,`${PRESENCE_PATH}/${currentKey}`);
 set(mine,{name:currentUsername,online:true,typing:false,lastSeen:Date.now()});
 onDisconnect(mine).remove().catch(console.error);

 onValue2(ref(db,".info/connected"),snap=>{
  if(snap.val()===true){
   set(mine,{name:currentUsername,online:true,typing:false,lastSeen:Date.now()});
   onDisconnect(mine).remove().catch(console.error);
  }
 });
}
onValue(presenceRef,snap=>{
 presenceCache=snap.val()||{};
 updateOnline();
 updateTyping();
});
function activeUsers(){
 return Object.values(presenceCache).filter(x=>x&&x.online===true);
}
function updateOnline(){
 const users=activeUsers();
 const count=users.length;
 onlineText.textContent=count===0?"Hech kim online":count===1?"1 kishi online":`${count} kishi online`;
 statusDot.classList.toggle("online",count>0);
}
function updateTyping(){
 const other=activeUsers().find(x=>x.name!==currentUsername&&x.typing);
 if(other){typingName.textContent=other.name;typingBox.classList.remove("hidden")}
 else typingBox.classList.add("hidden");
}
function setTyping(value){
 if(!currentKey)return;
 set(ref(db,`${PRESENCE_PATH}/${currentKey}/typing`),value).catch(()=>{});
}
messageInput.addEventListener("input",()=>{
 setTyping(messageInput.value.trim().length>0);
 clearTimeout(typingTimer);
 typingTimer=setTimeout(()=>setTyping(false),1200);
});

function formatTime(ts){return new Date(ts).toLocaleTimeString("uz-UZ",{hour:"2-digit",minute:"2-digit"})}
function renderMessages(data){
 messagesCache=data||{};messagesBox.innerHTML="";
 const list=Object.entries(messagesCache).map(([id,m])=>normalize(id,m))
  .filter(m=>m.timestamp>0&&Date.now()-m.timestamp<=ONE_HOUR)
  .sort((a,b)=>a.timestamp-b.timestamp);
 if(!list.length){messagesBox.appendChild(empty);return}
 let lastDay="";
 for(const msg of list){
  const d=new Date(msg.timestamp).toLocaleDateString("uz-UZ");
  if(d!==lastDay){const day=document.createElement("div");day.className="day";day.textContent=d;messagesBox.appendChild(day);lastDay=d}
  const mine=msg.author===currentUsername,row=document.createElement("div");
  row.className="msgRow "+(mine?"mine":"other");
  if(!mine){const av=document.createElement("div");av.className="avatar";av.textContent=(msg.author||"?").charAt(0).toUpperCase();row.appendChild(av)}
  const bubble=document.createElement("div");bubble.className="bubble";
  if(!mine){const n=document.createElement("div");n.className="name";n.textContent=msg.author||"Noma'lum";bubble.appendChild(n)}
  if(msg.image){
   const img=document.createElement("img");img.className="photo";img.src=msg.image;img.alt="Rasm";
   img.onclick=()=>{$("bigImage").src=msg.image;$("imageModal").classList.remove("hidden")};bubble.appendChild(img);
  }
  if(msg.text){const t=document.createElement("div");t.className="text";t.textContent=msg.text;bubble.appendChild(t)}
  const tm=document.createElement("div");tm.className="time";tm.textContent=formatTime(msg.timestamp)+(mine?"  ✓✓":"");bubble.appendChild(tm);
  if(mine){const a=document.createElement("div");a.className="actions";const b=document.createElement("button");b.className="deleteBtn";b.textContent="O‘chirish";b.onclick=()=>openDelete(msg.id);a.appendChild(b);bubble.appendChild(a)}
  row.appendChild(bubble);messagesBox.appendChild(row);
 }
 messagesBox.scrollTop=messagesBox.scrollHeight;
}
onValue(messagesRef,snap=>renderMessages(snap.val()),err=>{console.error(err);messagesBox.innerHTML='<div class="empty">Firebase bilan ulanishda xatolik.</div>'});

async function cleanup(){
 const now=Date.now();
 for(const [id,m] of Object.entries(messagesCache)){
  const msg=normalize(id,m);
  if(msg.timestamp&&now-msg.timestamp>ONE_HOUR){
   try{await remove(ref(db,`${MESSAGES_PATH}/${id}`))}catch(e){console.error(e)}
  }
 }
}
setInterval(cleanup,60000);cleanup();

function fileToDataURL(file){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onerror=()=>reject(new Error("Rasmni o‘qib bo‘lmadi."));
  reader.onload=()=>{
   const img=new Image();
   img.onerror=()=>reject(new Error("Rasm formati o‘qilmadi."));
   img.onload=()=>{
    const MAX_SIDE=1400;
    const scale=Math.min(1,MAX_SIDE/Math.max(img.width,img.height));
    const w=Math.max(1,Math.round(img.width*scale));
    const h=Math.max(1,Math.round(img.height*scale));
    const canvas=document.createElement("canvas");
    canvas.width=w;canvas.height=h;
    const ctx=canvas.getContext("2d",{alpha:false});
    ctx.drawImage(img,0,0,w,h);
    // RTDB uchun rasmni kichraytirib yuboramiz: tezroq va ishonchliroq.
    resolve(canvas.toDataURL("image/jpeg",0.78));
   };
   img.src=reader.result;
  };
  reader.readAsDataURL(file);
 });
}
async function sendMessage(){
 const text=messageInput.value.trim(),file=imageInput.files[0];
 if(!text&&!file)return;
 if(file&&file.size>12*1024*1024){alert("Rasm 12 MB dan kichik bo‘lsin.");return}
 let image="";
 try{
  if(file)image=await fileToDataURL(file);
  await push(messagesRef,{author:currentUsername,timestamp:Date.now(),text:text||null,image:image||null});
  messageInput.value="";imageInput.value="";setTyping(false);messageInput.focus();
 }catch(e){console.error(e);alert("Xabar yuborilmadi. Firebase sozlamalarini tekshiring.")}
}
$("imageInput").addEventListener("change",()=>{
 const file=$("imageInput").files[0];
 if(file){
  if(file.size>12*1024*1024){
   alert("Rasm 12 MB dan kichik bo‘lsin.");
   $("imageInput").value="";
   return;
  }
  messageInput.placeholder="Rasm tayyor — yuborish uchun ➤ bosing";
 }
});
$("sendBtn").onclick=sendMessage;

function openDelete(id){pendingDelete=id;$("deleteModal").classList.remove("hidden")}
$("cancelDelete").onclick=()=>{pendingDelete=null;$("deleteModal").classList.add("hidden")};
$("confirmDelete").onclick=async()=>{
 if(!pendingDelete)return;
 const msg=normalize(pendingDelete,messagesCache[pendingDelete]);
 if(msg.author!==currentUsername){alert("Faqat o‘zingiz yuborgan xabarni o‘chira olasiz.")}
 else{try{await remove(ref(db,`${MESSAGES_PATH}/${pendingDelete}`))}catch(e){alert("O‘chirishda xatolik.")}}
 pendingDelete=null;$("deleteModal").classList.add("hidden");
};
$("imageModal").onclick=()=>$("imageModal").classList.add("hidden");
$("logoutBtn").onclick=async()=>{
 setTyping(false);
 if(currentKey){try{await remove(ref(db,`${PRESENCE_PATH}/${currentKey}`))}catch(e){}}
 sessionStorage.removeItem("toper_presence_key");
 currentKey="";currentUsername="";
 showPin();
};
window.addEventListener("beforeunload",()=>{if(currentKey)remove(ref(db,`${PRESENCE_PATH}/${currentKey}`)).catch(()=>{})});

// Har safar sayt qayta ochilganda PIN yana so‘raladi.
window.addEventListener("load",()=>showPin());
</script>
</body>
</html>
