<style>
:root{
 --primary:#6757e8;--primary2:#806ff5;--ink:#171827;--muted:#8991a7;
 --line:#e8eaf2;--soft:#f6f7fc;--green:#24c768;--danger:#e5484d;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink);background:#eef0f8}
button,input{font:inherit}button{cursor:pointer}
.hidden{display:none!important}

/* LOGIN */
#loginScreen{
 height:100dvh;display:grid;place-items:center;padding:20px;
 background:radial-gradient(circle at 15% 10%,#aaa0ff 0,transparent 35%),
 linear-gradient(135deg,#4e40c8,#796bf0);
}
.login-card{
 width:min(410px,100%);padding:35px 28px 30px;text-align:center;
 background:#ffffffed;border:1px solid #ffffff80;border-radius:30px;
 backdrop-filter:blur(22px);box-shadow:0 30px 90px #241b6838;
}
.login-logo{
 width:80px;height:80px;margin:0 auto 18px;border-radius:25px;
 display:grid;place-items:center;color:white;font-size:35px;font-weight:900;
 background:linear-gradient(145deg,#8171fa,#5645d8);
 box-shadow:0 14px 30px #604ee842;
}
.login-card h1{font-size:30px;letter-spacing:-1px}
.login-card .sub{margin:8px 0 25px;color:#7b8297;font-size:14px}
.login-card input{
 width:100%;height:54px;padding:0 17px;border:1px solid #dfe2eb;
 border-radius:16px;outline:none;background:#fff;text-align:center;
 letter-spacing:3px;font-size:18px;
}
.login-card input.name-input{text-align:left;letter-spacing:0;font-size:15px}
.login-card input:focus{border-color:var(--primary);box-shadow:0 0 0 4px #6757e814}
.login-btn{
 width:100%;height:54px;margin-top:9px;border:0;border-radius:16px;
 color:#fff;font-weight:800;background:linear-gradient(135deg,#7867f1,#5947d9);
 box-shadow:0 10px 24px #6655e63b;
}
.error{height:20px;margin-top:6px;color:var(--danger);font-size:13px}

/* APP */
#chatScreen{
 width:100%;max-width:1200px;height:100dvh;margin:auto;background:white;
 display:flex;flex-direction:column;box-shadow:0 0 55px #24274a12;
}
.header{
 height:82px;flex:none;padding:0 25px;display:flex;align-items:center;
 justify-content:space-between;background:#ffffffed;border-bottom:1px solid var(--line);
 backdrop-filter:blur(18px);z-index:5;
}
.brand{display:flex;align-items:center;gap:13px}
.brand-icon{
 width:51px;height:51px;border-radius:17px;display:grid;place-items:center;
 color:#fff;font-size:23px;font-weight:900;background:linear-gradient(145deg,#8170f9,#5946da);
 box-shadow:0 10px 25px #6757e82c;
}
.brand-title{font-size:19px;font-weight:850;letter-spacing:-.3px}
.status{display:flex;align-items:center;gap:6px;color:#80889d;font-size:12px;margin-top:4px}
.status-dot{width:8px;height:8px;border-radius:50%;background:#bcc2cf}
.status-dot.online{background:var(--green);box-shadow:0 0 0 4px #24c76818}
.logout{
 border:0;border-radius:13px;padding:10px 15px;background:#fff0f2;color:#c33e4b;
 font-weight:700;transition:.2s;
}.logout:hover{background:#ffe4e8}

/* MESSAGES */
.messages{
 flex:1;overflow-y:auto;padding:27px 24px 14px;
 background-color:#f8f8fc;
 background-image:radial-gradient(#dfe1ee 1px,transparent 1px);
 background-size:25px 25px;
 scroll-behavior:smooth;
}
.day{text-align:center;color:#a0a6b7;font-size:11px;margin:0 0 18px}
.msg-row{display:flex;align-items:flex-end;gap:9px;margin-bottom:13px}
.msg-row.mine{justify-content:flex-end}
.avatar{
 width:35px;height:35px;flex:none;border-radius:50%;display:grid;place-items:center;
 color:#fff;font-size:12px;font-weight:800;background:linear-gradient(145deg,#8272fa,#5c49dc);
}
.bubble{
 max-width:min(73%,540px);padding:11px 13px;border:1px solid #eceef5;
 border-radius:19px 19px 19px 6px;background:#fff;
 box-shadow:0 6px 20px #26304c0d;
}
.mine .bubble{
 color:#fff;border:0;border-radius:19px 19px 6px 19px;
 background:linear-gradient(135deg,#7867f2,#604ddd);
 box-shadow:0 9px 23px #6655df25;
}
.name{font-size:11px;font-weight:800;color:var(--primary);margin-bottom:4px}
.mine .name{color:#eceaff}
.text{font-size:15px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.photo{
 display:block;width:auto;max-width:300px;max-height:360px;object-fit:cover;
 border-radius:14px;cursor:pointer;margin-bottom:4px;
}
.time{font-size:10px;text-align:right;color:#9ba2b3;margin-top:5px}
.mine .time{color:#ddd9ff}
.actions{text-align:right;margin-top:4px}
.delete-btn{border:0;background:transparent;color:#8e96a8;font-size:10px;padding:1px}
.mine .delete-btn{color:#e5e1ff}
.empty{text-align:center;padding-top:18vh;color:#a1a8b8;font-size:14px}

/* TYPING */
.typing{
 height:27px;display:flex;align-items:center;gap:6px;padding-left:68px;
 color:#81899c;font-size:12px;background:#fff;
}
.dots{display:flex;gap:3px}.dots i{
 width:5px;height:5px;border-radius:50%;background:#9da5b7;animation:bounce .9s infinite
}.dots i:nth-child(2){animation-delay:.12s}.dots i:nth-child(3){animation-delay:.24s}
@keyframes bounce{50%{transform:translateY(-4px)}}

/* COMPOSER */
.composer-wrap{flex:none;padding:10px 17px 5px;background:#fff;border-top:1px solid var(--line)}
.composer{display:flex;align-items:center;gap:9px}
.icon-btn{
 width:48px;height:48px;border:0;border-radius:15px;background:#f0f1f7;
 display:grid;place-items:center;font-size:19px;transition:.18s;
}.icon-btn:hover{transform:translateY(-1px);background:#e9eaf3}
.send{
 color:#fff!important;font-size:21px;
 background:linear-gradient(135deg,#7866f1,#5946d8)!important;
 box-shadow:0 8px 18px #6655df30!important;
}
.message-input{
 flex:1;min-width:0;height:48px;border:1px solid #dfe2ec;border-radius:16px;
 padding:0 15px;outline:none;background:#fafbfe;
}.message-input:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px #6757e810}

/* EMOJI */
.emoji-panel{
 position:absolute;bottom:72px;right:70px;width:270px;padding:12px;
 border:1px solid var(--line);border-radius:18px;background:#fff;
 box-shadow:0 18px 50px #22283b20;display:grid;grid-template-columns:repeat(8,1fr);
 gap:5px;z-index:10;
}
.emoji-panel button{border:0;background:transparent;border-radius:9px;font-size:20px;padding:6px}
.emoji-panel button:hover{background:#f0f1f7}

/* MODALS */
.modal{
 position:fixed;inset:0;background:#0009;display:flex;align-items:center;
 justify-content:center;padding:20px;z-index:30;
}
.modal-box{width:min(350px,100%);padding:23px;border-radius:21px;background:#fff;text-align:center}
.modal-box h3{margin-bottom:8px}.modal-box p{color:#7d8598;font-size:13px;margin-bottom:18px}
.modal-buttons{display:flex;gap:8px}.modal-buttons button{
 flex:1;height:44px;border:0;border-radius:12px
}.cancel{background:#eef0f5}.danger{background:var(--danger);color:#fff}
.image-modal img{max-width:95vw;max-height:88vh;border-radius:16px}

/* MOBILE */
@media(max-width:650px){
 .header{height:67px;padding:0 11px}.brand-icon{width:43px;height:43px;border-radius:14px}
 .brand-title{font-size:16px}.status{font-size:11px}.logout{font-size:12px;padding:9px 11px}
 .messages{padding:18px 9px}.bubble{max-width:84%}.avatar{width:30px;height:30px}
 .photo{max-width:230px;max-height:310px}.composer-wrap{padding:8px 8px 4px}
 .icon-btn{width:44px;height:46px}.message-input{height:46px}
 .emoji-panel{right:8px;bottom:70px;width:270px}
}
</style>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
 getDatabase,ref,push,onValue,onDisconnect,set,remove
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

const firebaseConfig={
 apiKey:"AIzaSyAV7jDmCi89XU3-xLpk_WRU_mXbFcAK_qY",
 authDomain:"kiyimlar-olamiz-uz.firebaseapp.com",
 databaseURL:"https://kiyimlar-olamiz-uz-default-rtdb.firebaseio.com",
 projectId:"kiyimlar-olamiz-uz",
 storageBucket:"kiyimlar-olamiz-uz.firebasestorage.app",
 messagingSenderId:"721401033200",
 appId:"1:721401033200:web:d543e11684bfdb39fa2d35"
};

const ACCESS_CODE="0906";
const ONE_HOUR=60*60*1000;
const ROOM="bizning-suhbat-2026";
const MESSAGES_PATH=`rooms/${ROOM}/messages`;
const PRESENCE_PATH=`rooms/${ROOM}/presence`;

const db=getDatabase(initializeApp(firebaseConfig));
const messagesRef=ref(db,MESSAGES_PATH);
const presenceRef=ref(db,PRESENCE_PATH);
const $=id=>document.getElementById(id);

let currentUsername="";
let currentKey="";
let messagesCache={};
let presenceCache={};
let pendingDelete=null;
let typingTimer=null;

function normalize(id,m){
 return {
  id,
  author:m?.author??m?.sender??"",
  timestamp:Number(m?.timestamp??m?.createdAt??0),
  text:m?.text??"",
  image:m?.image??""
 };
}

function showPin(){
 $("loginScreen").classList.remove("hidden");
 $("chatScreen").classList.add("hidden");
 $("pinStep").classList.remove("hidden");
 $("nameStep").classList.add("hidden");
 $("pinInput").value="";
 $("pinError").textContent="";
 setTimeout(()=>$("pinInput").focus(),100);
}

function enterChat(){
 $("loginScreen").classList.add("hidden");
 $("chatScreen").classList.remove("hidden");
 setupPresence();
 $("messageInput").focus();
}

function loginPin(){
 if($("pinInput").value!==ACCESS_CODE){
  // Ataylab haqiqiy kodni ko‘rsatmaymiz.
  $("pinError").textContent="Kirish kodi noto‘g‘ri. Qaytadan urinib ko‘ring.";
  $("pinInput").value="";
  $("pinInput").focus();
  return;
 }
 $("pinError").textContent="";
 const saved=localStorage.getItem("toper_username");
 if(saved){
  currentUsername=saved;
  enterChat();
 }else{
  $("pinStep").classList.add("hidden");
  $("nameStep").classList.remove("hidden");
  $("nameInput").focus();
 }
}

function loginName(){
 const name=$("nameInput").value.trim();
 if(name.length<2){
  $("nameError").textContent="Ism kamida 2 ta belgidan iborat bo‘lsin.";
  return;
 }
 $("nameError").textContent="";
 currentUsername=name;
 localStorage.setItem("toper_username",name);
 enterChat();
}

$("pinBtn").onclick=loginPin;
$("nameBtn").onclick=loginName;
$("pinInput").onkeydown=e=>{if(e.key==="Enter")loginPin()};
$("nameInput").onkeydown=e=>{if(e.key==="Enter")loginName()};
$("messageInput").onkeydown=e=>{
 if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}
};

function setupPresence(){
 if(!currentUsername)return;
 currentKey=sessionStorage.getItem("toper_presence_key");
 if(!currentKey){
  currentKey=crypto.randomUUID?
   crypto.randomUUID():
   Date.now().toString(36)+Math.random().toString(36).slice(2);
  sessionStorage.setItem("toper_presence_key",currentKey);
 }
 const mine=ref(db,`${PRESENCE_PATH}/${currentKey}`);
 const onlineData={name:currentUsername,online:true,typing:false,lastSeen:Date.now()};
 set(mine,onlineData);
 onDisconnect(mine).remove().catch(()=>{});

 onValue(ref(db,".info/connected"),snap=>{
  if(snap.val()===true){
   set(mine,onlineData).catch(()=>{});
   onDisconnect(mine).remove().catch(()=>{});
  }
 });
}

onValue(presenceRef,snap=>{
 presenceCache=snap.val()||{};
 updateOnline();
 updateTyping();
});

function activeUsers(){
 return Object.values(presenceCache).filter(x=>x&&x.online===true);
}

function updateOnline(){
 const count=activeUsers().length;
 $("onlineText").textContent=
  count===0?"Hech kim online":
  count===1?"1 kishi online":
  `${count} kishi online`;
 $("statusDot").classList.toggle("online",count>0);
}

function updateTyping(){
 const other=activeUsers().find(x=>x.name!==currentUsername&&x.typing===true);
 $("typingBox").classList.toggle("hidden",!other);
 if(other)$("typingName").textContent=other.name;
}

function setTyping(value){
 if(currentKey)set(ref(db,`${PRESENCE_PATH}/${currentKey}/typing`),value).catch(()=>{});
}

$("messageInput").oninput=()=>{
 setTyping($("messageInput").value.trim().length>0);
 clearTimeout(typingTimer);
 typingTimer=setTimeout(()=>setTyping(false),1200);
};

function formatTime(ts){
 return new Date(ts).toLocaleTimeString("uz-UZ",{hour:"2-digit",minute:"2-digit"});
}

function renderMessages(data){
 messagesCache=data||{};
 $("messages").innerHTML="";

 const list=Object.entries(messagesCache)
  .map(([id,m])=>normalize(id,m))
  .filter(m=>m.timestamp>0&&Date.now()-m.timestamp<=ONE_HOUR)
  .sort((a,b)=>a.timestamp-b.timestamp);

 if(!list.length){
  $("messages").appendChild($("empty"));
  return;
 }

 let lastDay="";
 for(const m of list){
  const d=new Date(m.timestamp).toLocaleDateString("uz-UZ");
  if(d!==lastDay){
   const day=document.createElement("div");
   day.className="day";day.textContent=d;
   $("messages").appendChild(day);lastDay=d;
  }

  const mine=m.author===currentUsername;
  const row=document.createElement("div");
  row.className="msg-row "+(mine?"mine":"other");

  if(!mine){
   const av=document.createElement("div");
   av.className="avatar";
   av.textContent=(m.author||"?").charAt(0).toUpperCase();
   row.appendChild(av);
  }

  const bubble=document.createElement("div");
  bubble.className="bubble";

  if(!mine){
   const n=document.createElement("div");
   n.className="name";n.textContent=m.author||"Noma'lum";
   bubble.appendChild(n);
  }

  if(m.image){
   const img=document.createElement("img");
   img.className="photo";img.src=m.image;img.alt="Rasm";img.loading="lazy";
   img.onclick=()=>{
    $("bigImage").src=m.image;
    $("imageModal").classList.remove("hidden");
   };
   bubble.appendChild(img);
  }

  if(m.text){
   const t=document.createElement("div");
   t.className="text";t.textContent=m.text;
   bubble.appendChild(t);
  }

  const tm=document.createElement("div");
  tm.className="time";
  tm.textContent=formatTime(m.timestamp)+(mine?"  ✓✓":"");
  bubble.appendChild(tm);

  if(mine){
   const actions=document.createElement("div");
   actions.className="actions";
   const del=document.createElement("button");
   del.className="delete-btn";
   del.textContent="O‘chirish";
   del.onclick=()=>{
    pendingDelete=m.id;
    $("deleteModal").classList.remove("hidden");
   };
   actions.appendChild(del);bubble.appendChild(actions);
  }

  row.appendChild(bubble);
  $("messages").appendChild(row);
 }
 $("messages").scrollTop=$("messages").scrollHeight;
}

onValue(messagesRef,snap=>renderMessages(snap.val()),err=>{
 console.error(err);
 $("messages").innerHTML='<div class="empty">Chatga ulanishda xatolik.</div>';
});

async function cleanupExpired(){
 for(const [id,m] of Object.entries(messagesCache)){
  const x=normalize(id,m);
  if(x.timestamp&&Date.now()-x.timestamp>ONE_HOUR){
   try{await remove(ref(db,`${MESSAGES_PATH}/${id}`))}catch(e){}
  }
 }
}
setInterval(cleanupExpired,60000);

function compressImage(file){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onload=()=>{
   const img=new Image();
   img.onload=()=>{
    const max=900;
    let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
    if(!w||!h){reject(new Error("Rasm o‘qilmadi"));return}
    if(w>max||h>max){
     const scale=Math.min(max/w,max/h);
     w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale));
    }
    const canvas=document.createElement("canvas");
    canvas.width=w;canvas.height=h;
    const ctx=canvas.getContext("2d",{alpha:false});
    if(!ctx){reject(new Error("Canvas ishlamadi"));return}
    ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);
    ctx.drawImage(img,0,0,w,h);
    let quality=.68;
    let data=canvas.toDataURL("image/jpeg",quality);
    while(data.length>1200000&&quality>.35){
     quality-=.06;
     data=canvas.toDataURL("image/jpeg",quality);
    }
    if(data.length>1500000){reject(new Error("Rasm hajmi katta"));return}
    resolve(data);
   };
   img.onerror=()=>reject(new Error("Rasm formati o‘qilmadi"));
   img.src=reader.result;
  };
  reader.onerror=()=>reject(new Error("Fayl o‘qilmadi"));
  reader.readAsDataURL(file);
 });
}

async function sendMessage(){
 const text=$("messageInput").value.trim();
 const file=$("imageInput").files[0];
 if(!text&&!file)return;

 const sendBtn=$("sendBtn");
 sendBtn.disabled=true;sendBtn.style.opacity=".65";

 try{
  let image="";
  if(file){
   if(!file.type.startsWith("image/")){
    alert("Faqat rasm faylini tanlang.");
    return;
   }
   image=await compressImage(file);
  }

  await push(messagesRef,{
   author:currentUsername,
   timestamp:Date.now(),
   text:text||null,
   image:image||null
  });

  $("messageInput").value="";
  $("imageInput").value="";
  $("messageInput").placeholder="Xabar yozing...";
  $("emojiPanel").classList.add("hidden");
  setTyping(false);
  $("messageInput").focus();
 }catch(e){
  console.error(e);
  alert(file?"Rasm yuborilmadi. Rasmni qayta tanlab ko‘ring.":"Xabar yuborilmadi. Internetni tekshirib qayta urinib ko‘ring.");
 }finally{
  sendBtn.disabled=false;sendBtn.style.opacity="1";
 }
}
$("sendBtn").onclick=sendMessage;
$("imageInput").addEventListener("change",()=>{
 const file=$("imageInput").files[0];
 $("messageInput").placeholder=file?"Rasm tayyor — yuborish tugmasini bosing":"Xabar yozing...";
});


$("cancelDelete").onclick=()=>{
 pendingDelete=null;
 $("deleteModal").classList.add("hidden");
};

$("confirmDelete").onclick=async()=>{
 if(!pendingDelete)return;
 const msg=normalize(pendingDelete,messagesCache[pendingDelete]);
 try{
  if(msg.author===currentUsername){
   await remove(ref(db,`${MESSAGES_PATH}/${pendingDelete}`));
  }
 }catch(e){alert("Xabarni o‘chirishda xatolik.")}
 pendingDelete=null;
 $("deleteModal").classList.add("hidden");
};

$("imageModal").onclick=()=>$("imageModal").classList.add("hidden");

const panel=$("emojiPanel");
emojis.forEach(e=>{
 const b=document.createElement("button");
 b.textContent=e;
 b.onclick=()=>{
  const input=$("messageInput"),start=input.selectionStart,end=input.selectionEnd;
  input.value=input.value.slice(0,start)+e+input.value.slice(end);
  input.focus();input.selectionStart=input.selectionEnd=start+e.length;
  panel.classList.add("hidden");
 };
 panel.appendChild(b);
});
$("emojiBtn").onclick=e=>{
 e.stopPropagation();panel.classList.toggle("hidden");
};
document.addEventListener("click",e=>{
 if(!panel.contains(e.target)&&e.target!==$("emojiBtn"))panel.classList.add("hidden");
});

 sessionStorage.removeItem("toper_presence_key");
