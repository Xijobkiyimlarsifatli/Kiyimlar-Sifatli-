<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Toper.uz - Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: #fff;
            color: #1a1a1a;
            -webkit-font-smoothing: antialiased;
            -webkit-touch-callout: none;
        }

        body {
            position: fixed;
            overflow: hidden;
            padding-top: max(env(safe-area-inset-top), 0px);
            padding-bottom: max(env(safe-area-inset-bottom), 0px);
        }

        /* ========== LOGIN SCREEN ========== */
        #loginScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            font-size: 16px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .login-logo {
            font-size: 32px;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 10px;
        }

        .login-subtitle {
            color: #999;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .login-step {
            display: none;
            animation: fadeIn 0.3s;
        }

        .login-step.active {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .login-label {
            text-align: left;
            font-size: 14px;
            color: #666;
            font-weight: 500;
            margin-bottom: 8px;
        }

        #pinInput {
            width: 100%;
            padding: 14px;
            font-size: 32px;
            text-align: center;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            letter-spacing: 15px;
            font-weight: bold;
            transition: border-color 0.3s;
        }

        #pinInput:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        #usernameInput {
            width: 100%;
            padding: 12px 14px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            transition: border-color 0.3s;
        }

        #usernameInput:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .login-error {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 10px;
            min-height: 18px;
        }

        /* ========== CHAT SCREEN ========== */
        #chatScreen {
            display: none;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #fff;
        }

        #chatScreen.active {
            display: flex;
        }

        /* Header */
        #header {
            background: white;
            border-bottom: 1px solid #f0f0f0;
            padding: 12px 16px;
            padding-top: max(12px, env(safe-area-inset-top));
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            min-height: 56px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .header-title {
            font-weight: 700;
            font-size: 18px;
            color: #667eea;
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #999;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #31a24c;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .logout-btn {
            background: none;
            border: none;
            color: #667eea;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .logout-btn:active {
            background: #f5f5f5;
        }

        /* Messages Container */
        #messagesContainer {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            -webkit-overflow-scrolling: touch;
        }

        /* Messages Styling */
        .message-group {
            display: flex;
            margin-bottom: 12px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-group.own {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 18px;
            word-wrap: break-word;
            position: relative;
            display: inline-block;
        }

        .message-group.own .message-bubble {
            background: linear-gradient(135deg, #31a24c 0%, #2d8f40 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message-group.other .message-bubble {
            background: #f0f0f0;
            color: #1a1a1a;
            border-bottom-left-radius: 4px;
        }

        .message-image {
            max-width: 100%;
            max-height: 300px;
            border-radius: 14px;
            margin-top: 6px;
            cursor: pointer;
            transition: filter 0.2s;
        }

        .message-image:active {
            filter: brightness(0.9);
        }

        .message-info {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
            font-size: 12px;
            opacity: 0.85;
        }

        .message-group.own .message-info {
            justify-content: flex-end;
            color: rgba(255, 255, 255, 0.85);
        }

        .message-group.other .message-info {
            color: #999;
        }

        .delete-btn {
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            font-size: 12px;
            padding: 2px 6px;
            opacity: 0.8;
            transition: opacity 0.2s;
            font-weight: 500;
        }

        .message-group.own .delete-btn {
            color: rgba(255, 255, 255, 0.9);
        }

        .delete-btn:active {
            opacity: 0.6;
        }

        /* Input Area */
        #inputArea {
            background: white;
            border-top: 1px solid #f0f0f0;
            padding: 12px 12px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            display: flex;
            gap: 8px;
            flex-shrink: 0;
            align-items: flex-end;
        }

        .input-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .action-btn {
            width: 40px;
            height: 40px;
            background: #f0f0f0;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .action-btn:active {
            background: #e0e0e0;
        }

        #imageInput {
            display: none;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            min-height: 40px;
        }

        #messageInput {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #e0e0e0;
            border-radius: 20px;
            font-size: 16px;
            font-family: inherit;
            resize: none;
            max-height: 100px;
            overflow-y: auto;
            -webkit-appearance: none;
            transition: border-color 0.2s;
        }

        #messageInput:focus {
            outline: none;
            border-color: #667eea;
        }

        .send-btn {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: transform 0.2s;
            flex-shrink: 0;
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        /* Footer */
        #footer {
            text-align: center;
            font-size: 12px;
            color: #999;
            padding: 12px;
            border-top: 1px solid #f0f0f0;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 24px;
            max-width: 300px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .modal-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #1a1a1a;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .modal-btn {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .modal-btn.cancel {
            background: #f0f0f0;
            color: #666;
        }

        .modal-btn.confirm {
            background: #e74c3c;
            color: white;
        }

        .modal-btn:active {
            transform: scale(0.95);
        }

        /* Scrollbar */
        #messagesContainer::-webkit-scrollbar {
            width: 6px;
        }

        #messagesContainer::-webkit-scrollbar-track {
            background: transparent;
        }

        #messagesContainer::-webkit-scrollbar-thumb {
            background: #ddd;
            border-radius: 3px;
        }

        /* Utilities */
        .text-center {
            text-align: center;
        }

        .mt-20 {
            margin-top: 20px;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
            }

            .message-bubble {
                max-width: 90%;
            }

            #messagesContainer {
                padding: 12px;
                gap: 6px;
            }

            #inputArea {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- LOGIN SCREEN -->
    <div id="loginScreen">
        <div class="login-container">
            <div class="login-logo">Toper.uz</div>
            <div class="login-subtitle">Chat</div>

            <div class="login-form">
                <!-- PIN Step -->
                <div id="pinStep" class="login-step active">
                    <div class="login-label">PIN kodni kiriting</div>
                    <input 
                        type="password" 
                        id="pinInput" 
                        placeholder="• • • •" 
                        maxlength="4"
                        inputmode="numeric"
                    >
                    <div id="pinError" class="login-error"></div>
                    <button id="pinSubmitBtn" class="login-btn">Kiris</button>
                </div>

                <!-- Username Step -->
                <div id="usernameStep" class="login-step">
                    <div class="login-label">Ismingiz kiriting</div>
                    <input 
                        type="text" 
                        id="usernameInput" 
                        placeholder="Ismingiz..."
                        maxlength="30"
                    >
                    <div id="usernameError" class="login-error"></div>
                    <button id="usernameSubmitBtn" class="login-btn">Davom etish</button>
                </div>
            </div>
        </div>
    </div>

    <!-- CHAT SCREEN -->
    <div id="chatScreen">
        <div id="header">
            <div class="header-left">
                <div class="header-title">Toper.uz</div>
                <div class="header-status">
                    <span class="status-dot"></span>
                    <span>online</span>
                </div>
            </div>
            <div class="header-actions">
                <button id="logoutBtn" class="logout-btn">Chiqish</button>
            </div>
        </div>

        <div id="messagesContainer"></div>

        <div id="inputArea">
            <div class="input-actions">
                <button id="imageBtn" class="action-btn" title="Rasm yuborish">📷</button>
                <input type="file" id="imageInput" accept="image/*" capture="environment">
            </div>
            <div class="input-wrapper">
                <textarea 
                    id="messageInput" 
                    placeholder="Xabar yozing..."
                    rows="1"
                ></textarea>
                <button id="sendBtn" class="send-btn" title="Yuborish">▶</button>
            </div>
        </div>

        <div id="footer">Murodjon yaratgan ♥</div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="modal">
        <div class="modal-content">
            <div class="modal-title">Bu xabarni o'chirishni xohlaysizmi?</div>
            <div class="modal-buttons">
                <button id="cancelDeleteBtn" class="modal-btn cancel">Yo'q</button>
                <button id="confirmDeleteBtn" class="modal-btn confirm">O'chirish</button>
            </div>
        </div>
    </div>

    <!-- Image Modal -->
    <div id="imageModal" class="modal">
        <div style="position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;">
            <img id="modalImage" style="max-width: 90%; max-height: 80%; border-radius: 12px; object-fit: contain;" alt="">
        </div>
    </div>

    <script src="https://www.gstatic.com/firebaseapp/11.3.0/firebase-app-compat.min.js"></script>
    <script src="https://www.gstatic.com/firebaseapp/11.3.0/firebase-database-compat.min.js"></script>
    <script>
        // ========== CONSTANTS ==========
        const ACCESS_CODE = "0906";
        const ONE_HOUR = 60 * 60 * 1000;
        const CLEANUP_INTERVAL = 1 * 60 * 1000; // 1 minute

        // ========== FIREBASE CONFIG ==========
        const firebaseConfig = {
            apiKey: "AIzaSyAV7jDmCi89XU3-xLpk_WRU_mXbFcAK_qY",
            authDomain: "kiyimlar-olamiz-uz.firebaseapp.com",
            databaseURL: "https://kiyimlar-olamiz-uz-default-rtdb.firebaseio.com",
            projectId: "kiyimlar-olamiz-uz",
            storageBucket: "kiyimlar-olamiz-uz.firebasestorage.app",
            messagingSenderId: "721401033200",
            appId: "1:721401033200:web:d543e11684bfdb39fa2d35"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const ROOM_ID = "bizning-suhbat-2026";
        const MESSAGES_PATH = `rooms/${ROOM_ID}/messages`;

        // ========== STATE ==========
        let currentUsername = null;
        let messageToDelete = null;
        let messageListenerAttached = false;

        // ========== DOM ELEMENTS ==========
        const loginScreen = document.getElementById('loginScreen');
        const chatScreen = document.getElementById('chatScreen');
        const pinInput = document.getElementById('pinInput');
        const pinError = document.getElementById('pinError');
        const usernameInput = document.getElementById('usernameInput');
        const usernameError = document.getElementById('usernameError');
        const messagesContainer = document.getElementById('messagesContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const imageBtn = document.getElementById('imageBtn');
        const imageInput = document.getElementById('imageInput');
        const logoutBtn = document.getElementById('logoutBtn');
        const deleteModal = document.getElementById('deleteModal');
        const imageModal = document.getElementById('imageModal');
        const modalImage = document.getElementById('modalImage');
        const cancelDeleteBtn = document.getElementById('cancelDeleteBtn');
        const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');

        // ========== LOGIN FLOW ==========
        document.getElementById('pinSubmitBtn').addEventListener('click', handlePinSubmit);
        document.getElementById('usernameSubmitBtn').addEventListener('click', handleUsernameSubmit);

        pinInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handlePinSubmit();
            if (!/\d/.test(e.key) && !['Backspace', 'Delete'].includes(e.key)) e.preventDefault();
        });

        usernameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleUsernameSubmit();
        });

        function handlePinSubmit() {
            const pin = pinInput.value.trim();
            pinError.textContent = '';

            if (pin.length !== 4) {
                pinError.textContent = 'Kod 4 raqamli bo\'lishi kerak';
                return;
            }

            if (pin !== ACCESS_CODE) {
                pinError.textContent = 'Kod noto\'g\'ri';
                pinInput.value = '';
                return;
            }

            showUsernameStep();
        }

        function handleUsernameSubmit() {
            const username = usernameInput.value.trim();
            usernameError.textContent = '';

            if (username.length < 2) {
                usernameError.textContent = 'Ism kamida 2 ta belgi bo\'lishi kerak';
                return;
            }

            if (username.length > 30) {
                usernameError.textContent = 'Ism maksimal 30 ta belgi bo\'lishi kerak';
                return;
            }

            localStorage.setItem('toper_username', username);
            currentUsername = username;
            enterChat();
        }

        function showUsernameStep() {
            document.getElementById('pinStep').classList.remove('active');
            document.getElementById('usernameStep').classList.add('active');
            usernameInput.focus();
        }

        function enterChat() {
            loginScreen.style.display = 'none';
            chatScreen.classList.add('active');
            messageInput.focus();
            loadMessages();
            startCleanupInterval();
        }

        // ========== LOGOUT ==========
        logoutBtn.addEventListener('click', () => {
            if (confirm('Chiqishni tasdiqlaysizmi?')) {
                logout();
            }
        });

        function logout() {
            localStorage.removeItem('toper_username');
            currentUsername = null;
            messageToDelete = null;
            messageListenerAttached = false;
            
            pinInput.value = '';
            usernameInput.value = '';
            pinError.textContent = '';
            usernameError.textContent = '';
            messagesContainer.innerHTML = '';

            document.getElementById('pinStep').classList.add('active');
            document.getElementById('usernameStep').classList.remove('active');

            chatScreen.classList.remove('active');
            loginScreen.style.display = 'flex';
            pinInput.focus();
        }

        // ========== MESSAGE HANDLING ==========
        function loadMessages() {
            database.ref(MESSAGES_PATH).on('value', (snapshot) => {
                const messages = snapshot.val();
                
                if (!messageListenerAttached) {
                    messageListenerAttached = true;
                    renderMessages(messages);
                } else {
                    renderMessages(messages);
                }

                scrollToBottom();
                cleanupExpiredMessages();
            });
        }

        function renderMessages(messages) {
            messagesContainer.innerHTML = '';
            if (!messages) return;

            const messageArray = Object.entries(messages).map(([id, data]) => ({
                id,
                ...data
            }));

            messageArray.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

            messageArray.forEach(msg => {
                if (msg.timestamp && Date.now() - msg.timestamp > ONE_HOUR) {
                    return; // Skip expired messages
                }
                renderMessage(msg);
            });
        }

        function renderMessage(msg) {
            const isOwn = msg.author === currentUsername;
            const messageGroup = document.createElement('div');
            messageGroup.className = `message-group ${isOwn ? 'own' : 'other'}`;
            messageGroup.dataset.messageId = msg.id;

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';

            // Text content
            if (msg.text) {
                const textNode = document.createElement('div');
                textNode.textContent = msg.text;
                textNode.style.wordBreak = 'break-word';
                bubble.appendChild(textNode);
            }

            // Image content
            if (msg.image) {
                const img = document.createElement('img');
                img.src = msg.image;
                img.className = 'message-image';
                img.addEventListener('click', () => {
                    modalImage.src = msg.image;
                    imageModal.classList.add('active');
                });
                bubble.appendChild(img);
            }

            // Info
            const info = document.createElement('div');
            info.className = 'message-info';

            const time = new Date(msg.timestamp).toLocaleTimeString('uz-UZ', {
                hour: '2-digit',
                minute: '2-digit'
            });
            info.textContent = `${msg.author} • ${time}`;

            if (isOwn) {
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-btn';
                deleteBtn.textContent = 'O\'chirish';
                deleteBtn.addEventListener('click', () => {
                    messageToDelete = msg.id;
                    deleteModal.classList.add('active');
                });
                info.appendChild(deleteBtn);
            }

            bubble.appendChild(info);
            messageGroup.appendChild(bubble);
            messagesContainer.appendChild(messageGroup);
        }

        // ========== SEND MESSAGE ==========
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        messageInput.addEventListener('input', () => {
            messageInput.style.height = 'auto';
            messageInput.style.height = Math.min(messageInput.scrollHeight, 100) + 'px';
        });

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text && !messageInput.hasAttribute('data-image')) return;

            const messageData = {
                author: currentUsername,
                timestamp: Date.now(),
                text: text || null
            };

            if (messageInput.hasAttribute('data-image')) {
                messageData.image = messageInput.getAttribute('data-image');
                messageInput.removeAttribute('data-image');
                messageInput.style.backgroundImage = 'none';
            }

            database.ref(MESSAGES_PATH).push(messageData);
            messageInput.value = '';
            messageInput.style.height = 'auto';
            messageInput.focus();
            scrollToBottom();
        }

        // ========== IMAGE UPLOAD ==========
        imageBtn.addEventListener('click', () => imageInput.click());

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                compressImage(event.target.result, (compressed) => {
                    messageInput.setAttribute('data-image', compressed);
                    messageInput.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.1)), url(${compressed})`;
                    messageInput.style.backgroundSize = 'cover';
                    messageInput.style.backgroundPosition = 'center';
                    messageInput.focus();
                });
            };
            reader.readAsDataURL(file);
            imageInput.value = '';
        });

        function compressImage(dataUrl, callback) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const img = new Image();

            img.onload = () => {
                let width = img.width;
                let height = img.height;
                const maxDim = 800;

                if (width > height) {
                    if (width > maxDim) {
                        height = Math.round(height * (maxDim / width));
                        width = maxDim;
                    }
                } else {
                    if (height > maxDim) {
                        width = Math.round(width * (maxDim / height));
                        height = maxDim;
                    }
                }

                canvas.width = width;
                canvas.height = height;
                ctx.drawImage(img, 0, 0, width, height);
                callback(canvas.toDataURL('image/jpeg', 0.7));
            };

            img.src = dataUrl;
        }

        // ========== DELETE MESSAGE ==========
        cancelDeleteBtn.addEventListener('click', () => {
            deleteModal.classList.remove('active');
            messageToDelete = null;
        });

        confirmDeleteBtn.addEventListener('click', () => {
            if (messageToDelete) {
                database.ref(`${MESSAGES_PATH}/${messageToDelete}`).remove();
                deleteModal.classList.remove('active');
                messageToDelete = null;
            }
        });

        imageModal.addEventListener('click', () => {
            imageModal.classList.remove('active');
        });

        // ========== AUTO DELETE EXPIRED MESSAGES ==========
        function cleanupExpiredMessages() {
            database.ref(MESSAGES_PATH).once('value', (snapshot) => {
                const messages = snapshot.val();
                if (!messages) return;

                Object.entries(messages).forEach(([id, msg]) => {
                    if (msg.timestamp && Date.now() - msg.timestamp > ONE_HOUR) {
                        database.ref(`${MESSAGES_PATH}/${id}`).remove();
                    }
                });
            });
        }

        function startCleanupInterval() {
            setInterval(cleanupExpiredMessages, CLEANUP_INTERVAL);
        }

        // ========== SCROLL ==========
        function scrollToBottom() {
            setTimeout(() => {
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }, 50);
        }

        // ========== INIT ==========
        window.addEventListener('load', () => {
            const saved = localStorage.getItem('toper_username');
            if (saved) {
                currentUsername = saved;
                pinInput.value = '';
                usernameInput.value = '';
                enterChat();
            } else {
                pinInput.focus();
            }
        });

        // Prevent zoom on double tap
        let lastTouchEnd = 0;
        document.addEventListener('touchend', (e) => {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>
</body>
</html>
