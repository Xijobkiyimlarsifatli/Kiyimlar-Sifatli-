<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f3f8">
<title>Kiyimlar</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f3f8;color:#24202a}
button,input{font:inherit}
button{cursor:pointer}
.app{width:100%;max-width:820px;height:100dvh;margin:auto;background:#fff;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 30px #00000010}
header{padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top));border-bottom:1px solid #eee;background:#fff;display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#f3d8ff,#f7b9fc);font-weight:800;font-size:20px;color:#4e2d5f;flex:none}
.head{min-width:0;flex:1}.title{font-size:20px;font-weight:800;letter-spacing:-.2px}.sub{font-size:12px;color:#8b8492;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exit{border:0;background:#f2edf4;color:#4e4352;width:42px;height:42px;border-radius:14px;font-size:18px;flex:none}
#messages{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:16px 13px 20px;background:linear-gradient(180deg,#fbf9fc,#fff)}
.msg{display:flex;margin:8px 0}.msg.mine{justify-content:flex-end}
.bubble{max-width:min(82%,620px);padding:10px 12px;border-radius:19px 19px 19px 6px;background:#fff;border:1px solid #eee;box-shadow:0 2px 8px #00000008;overflow-wrap:anywhere}
.mine .bubble{border-radius:19px 19px 6px 19px;background:#2b2530;color:#fff;border-color:#2b2530}
.name{font-size:11px;font-weight:700;color:#8d748f;margin-bottom:4px}.mine .name{color:#d9c9df}
.msgtext{font-size:15px;line-height:1.45;white-space:pre-wrap}
.time{font-size:10px;opacity:.55;text-align:right;margin-top:5px}
.photo{display:block;width:100%;max-width:360px;max-height:460px;object-fit:cover;border-radius:14px;margin-top:4px}
.actions{display:flex;justify-content:flex-end;margin-top:5px}
.delete{border:0;background:transparent;color:#c25b72;font-size:11px;padding:2px 0}
form{display:flex;gap:8px;padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));border-top:1px solid #eee;background:#fff}
#text{min-width:0;flex:1;height:48px;border:1px solid #e4dde7;border-radius:17px;padding:0 15px;outline:none;background:#faf8fb}
#text:focus,#name:focus,#pin:focus{border-color:#cba9d4;box-shadow:0 0 0 3px #d9b9e525}
.iconbtn{width:48px;height:48px;border:0;border-radius:17px;background:#f2edf4;color:#59485f;font-size:20px;flex:none}
.send{width:48px;height:48px;border:0;border-radius:17px;background:#2b2530;color:#fff;font-size:19px;flex:none}
#file{display:none}
.status{font-size:11px;color:#8b8492;padding:0 14px 7px;text-align:center;min-height:18px}
.hidden{display:none!important}
#setup{position:fixed;inset:0;background:linear-gradient(135deg,#fbf4ff,#f7f3f8);display:grid;place-items:center;padding:20px;z-index:10}
.card{width:min(100%,390px);background:#fff;border-radius:26px;padding:26px 22px;box-shadow:0 15px 50px #00000012}
.lock{font-size:32px;text-align:center;margin-bottom:8px}.card h2{text-align:center;margin:0 0 7px}.card p{text-align:center;color:#8b8492;font-size:13px;margin:0 0 18px}
.field{width:100%;height:50px;border:1px solid #e4dde7;border-radius:16px;padding:0 15px;outline:none;background:#faf8fb;margin-bottom:10px}
.primary{width:100%;height:50px;border:0;border-radius:16px;background:#2b2530;color:#fff;font-weight:700}
.error{text-align:center;color:#c34f68;font-size:12px;min-height:17px;margin:3px 0 8px}
@media(max-width:520px){
 .app{max-width:none;box-shadow:none}
 header{padding-left:12px;padding-right:12px}
 #messages{padding-left:9px;padding-right:9px}
 .bubble{max-width:88%}
 form{padding-left:8px;padding-right:8px}
 .iconbtn,.send{width:46px;height:46px}
 #text{height:46px}
}
</style>
</head>
<body>

<div class="app">
<header>
  <div class="logo">K</div>
  <div class="head">
    <div class="title">Kiyimlar</div>
    <div class="sub" id="who">Kirish kutilmoqda...</div>
  </div>
  <button class="exit" id="logout" type="button" title="Chiqish">↪</button>
</header>

<div id="messages"></div>
<div class="status" id="status"></div>

<form id="form">
  <label class="iconbtn" for="file" title="Rasm yuborish">＋</label>
  <input id="file" type="file" accept="image/*">
  <input id="text" autocomplete="off" placeholder="Xabar yozing...">
  <button class="send" type="submit" title="Yuborish">➤</button>
</form>
</div>

<div id="setup">
  <div class="card">
    <div id="pinBox">
      <div class="lock">🔒</div>
      <h2>Kiyimlar</h2>
      <p>Kirish kodini kiriting.</p>
      <input class="field" id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="••••">
      <div class="error" id="pinError"></div>
      <button class="primary" id="pinBtn" type="button">Kirish</button>
    </div>

    <div id="nameBox" class="hidden">
      <div class="lock">👤</div>
      <h2>Ismingiz</h2>
      <p>Chatda ko‘rinadigan ismingizni kiriting.</p>
      <input class="field" id="name" maxlength="30" placeholder="Ismingiz">
      <div class="error" id="nameError"></div>
      <button class="primary" id="start" type="button">Chatga kirish</button>
    </div>
  </div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
  getDatabase, ref, push, onChildAdded, onChildRemoved, query,
  limitToLast, remove, get
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAV7jDmCi89XU3-xLpk_WRU_mXbFcAK_qY",
  authDomain: "kiyimlar-olamiz-uz.firebaseapp.com",
  databaseURL: "https://kiyimlar-olamiz-uz-default-rtdb.firebaseio.com",
  projectId: "kiyimlar-olamiz-uz",
  storageBucket: "kiyimlar-olamiz-uz.firebasestorage.app",
  messagingSenderId: "721401033200",
  appId: "1:721401033200:web:d543e11684bfdb39fa2d35"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);
const roomId="bizning-suhbat-2026";
const messagesRef=ref(db,"rooms/"+roomId+"/messages");
const ACCESS_CODE="0906";
const ONE_HOUR=60*60*1000;

const setup=document.getElementById("setup");
const pinBox=document.getElementById("pinBox");
const nameBox=document.getElementById("nameBox");
const pin=document.getElementById("pin");
const pinBtn=document.getElementById("pinBtn");
const pinError=document.getElementById("pinError");
const name=document.getElementById("name");
const nameError=document.getElementById("nameError");
const start=document.getElementById("start");
const who=document.getElementById("who");
const messages=document.getElementById("messages");
const form=document.getElementById("form");
const text=document.getElementById("text");
const file=document.getElementById("file");
const status=document.getElementById("status");
const logout=document.getElementById("logout");

let me=localStorage.getItem("chatName")||"";
let listening=false;

function unlock(){
  if(pin.value!==ACCESS_CODE){
    pinError.textContent="Kod noto‘g‘ri.";
    pin.value="";
    pin.focus();
    return;
  }
  sessionStorage.setItem("kiyimlarUnlocked","1");
  pinBox.classList.add("hidden");
  nameBox.classList.remove("hidden");
  if(me) connect();
  else name.focus();
}
pinBtn.onclick=unlock;
pin.addEventListener("keydown",e=>{if(e.key==="Enter")unlock()});

start.onclick=()=>{
  const v=name.value.trim();
  if(!v){
    nameError.textContent="Ismingizni kiriting.";
    name.focus();
    return;
  }
  if(v.length<2){
    nameError.textContent="Kamida 2 ta harf kiriting.";
    return;
  }
  localStorage.setItem("chatName",v);
  me=v;
  connect();
};

logout.onclick=()=>{
  sessionStorage.removeItem("kiyimlarUnlocked");
  location.reload();
};

function esc(s){
  return String(s??"").replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}

function formatTime(ts){
  const d=new Date(ts||Date.now());
  return d.toLocaleTimeString("uz-UZ",{hour:"2-digit",minute:"2-digit"});
}

function render(m,key){
  if(!m) return;
  const old=document.querySelector('[data-key="'+CSS.escape(key)+'"]');
  if(old) return;

  const mine=m.sender===me;
  const d=document.createElement("div");
  d.className="msg"+(mine?" mine":"");
  d.dataset.key=key;

  const bubble=document.createElement("div");
  bubble.className="bubble";

  bubble.innerHTML=
    '<div class="name">'+esc(m.sender||"Noma’lum")+'</div>'+
    (m.image?'<img class="photo" src="'+m.image+'" alt="Rasm">':"")+
    (m.text?'<div class="msgtext">'+esc(m.text)+'</div>':"")+
    '<div class="time">'+formatTime(m.createdAt)+'</div>'+
    (mine?'<div class="actions"><button class="delete" type="button">O‘chirish</button></div>':"");

  d.appendChild(bubble);
  messages.appendChild(d);
  messages.scrollTop=messages.scrollHeight;

  if(mine){
    const del=bubble.querySelector(".delete");
    del.onclick=async()=>{
      if(!confirm("Bu xabarni o‘chirishni xohlaysizmi?")) return;
      del.disabled=true;
      try{
        await remove(ref(db,"rooms/"+roomId+"/messages/"+key));
        status.textContent="Xabar o‘chirildi.";
        setTimeout(()=>status.textContent="",1800);
      }catch(err){
        del.disabled=false;
        status.textContent="O‘chirishda xatolik.";
      }
    };
  }
}

async function cleanupOldMessages(){
  try{
    const snap=await get(messagesRef);
    if(!snap.exists()) return;
    const now=Date.now();
    const jobs=[];
    snap.forEach(child=>{
      const m=child.val();
      if(m && m.createdAt && now-Number(m.createdAt)>=ONE_HOUR){
        jobs.push(remove(ref(db,"rooms/"+roomId+"/messages/"+child.key)));
      }
    });
    if(jobs.length) await Promise.all(jobs);
  }catch(err){
    console.warn("Avto tozalash:",err);
  }
}

function connect(){
  if(listening) return;
  listening=true;
  setup.classList.add("hidden");
  who.textContent=me+" · Xabarlar 1 soatdan keyin avtomatik o‘chadi";
  cleanupOldMessages();

  const q=query(messagesRef,limitToLast(100));
  onChildAdded(q,s=>{
    const m=s.val();
    if(m && m.createdAt && Date.now()-Number(m.createdAt)>=ONE_HOUR){
      remove(ref(db,"rooms/"+roomId+"/messages/"+s.key));
      return;
    }
    render(m,s.key);
  });

  onChildRemoved(q,s=>{
    const el=document.querySelector('[data-key="'+CSS.escape(s.key)+'"]');
    if(el) el.remove();
  });

  setInterval(cleanupOldMessages,60000);
  text.focus();
}

async function compressImage(fileObj){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const reader=new FileReader();
    reader.onload=()=>{
      img.onload=()=>{
        const max=1000;
        let w=img.width,h=img.height;
        if(Math.max(w,h)>max){
          if(w>h){h=Math.round(h*max/w);w=max}
          else{w=Math.round(w*max/h);h=max}
        }
        const c=document.createElement("canvas");
        c.width=w;c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        resolve(c.toDataURL("image/jpeg",0.78));
      };
      img.onerror=reject;
      img.src=reader.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(fileObj);
  });
}

form.onsubmit=async e=>{
  e.preventDefault();
  const message=text.value.trim();
  const selected=file.files[0];

  if(!message && !selected) return;

  status.textContent="Yuborilmoqda...";
  try{
    let image="";
    if(selected) image=await compressImage(selected);

    await push(messagesRef,{
      sender:me,
      text:message,
      image:image,
      createdAt:Date.now()
    });

    text.value="";
    file.value="";
    status.textContent="";
    text.focus();
  }catch(err){
    console.error(err);
    status.textContent="Xabar yuborilmadi. Qayta urinib ko‘ring.";
  }
};

if(sessionStorage.getItem("kiyimlarUnlocked")==="1"){
  pinBox.classList.add("hidden");
  nameBox.classList.remove("hidden");
  if(me) connect();
  else name.focus();
}else{
  setup.classList.remove("hidden");
  pin.focus();
}
</script>
</body>
</html>
