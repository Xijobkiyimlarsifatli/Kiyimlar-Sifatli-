<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f3f8">
<title>Kiyimlar</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#241f27;background:#f5f1f7}
button,input{font:inherit}
button{cursor:pointer}
.app{width:100%;max-width:820px;height:100dvh;margin:auto;background:#fff;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 40px rgba(40,25,45,.10)}
header{flex:none;padding:15px 16px calc(13px + env(safe-area-inset-top));padding-top:max(15px,env(safe-area-inset-top));background:rgba(255,255,255,.96);border-bottom:1px solid #eee8f0;display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,#2b2530,#66536d);color:white;font-size:20px;box-shadow:0 5px 14px rgba(50,35,55,.18)}
.head{min-width:0;flex:1}.title{font-size:19px;font-weight:800;letter-spacing:-.2px}.sub{font-size:12px;color:#8d8491;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exit{border:0;background:#f2edf4;color:#4e4352;width:42px;height:42px;border-radius:14px;font-size:18px}
#messages{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:18px 13px 20px;background:radial-gradient(circle at top,#fff 0,#fbf8fc 45%,#f6f2f8 100%)}
.msg{display:flex;margin:8px 0}.msg.mine{justify-content:flex-end}
.bubble{max-width:min(78%,560px);padding:10px 13px;border-radius:19px 19px 19px 6px;background:#fff;border:1px solid #eee8f0;box-shadow:0 3px 12px rgba(35,25,40,.06);overflow-wrap:anywhere}
.mine .bubble{border-radius:19px 19px 6px 19px;background:#2b2530;color:#fff;border-color:#2b2530}
.name{font-size:11px;font-weight:800;color:#8a728f;margin-bottom:4px}.mine .name{color:#d9c9df}
.msgtext{font-size:15px;line-height:1.45;white-space:pre-wrap}.time{font-size:10px;opacity:.55;text-align:right;margin-top:5px}.delete{display:block;margin-top:7px;margin-left:auto;border:0;background:transparent;color:#a99eaa;font-size:11px;padding:2px 0}.delete:hover{text-decoration:underline;color:#8d687f}.mine .delete{color:#cdbdce}
.photo{display:block;width:auto;max-width:100%;max-height:360px;border-radius:14px;margin-top:6px}
.empty{text-align:center;color:#9a919e;padding:55px 25px;font-size:14px}
#status{flex:none;min-height:18px;font-size:11px;color:#918894;text-align:center;padding:2px 10px;background:#fff}
form{flex:none;display:flex;align-items:center;gap:8px;padding:9px 10px calc(9px + env(safe-area-inset-bottom));border-top:1px solid #eee8f0;background:#fff}
#text{min-width:0;flex:1;height:48px;border:1px solid #e4dde7;border-radius:17px;padding:0 15px;outline:none;font-size:16px;background:#faf8fb;color:#27212a}
#text:focus{border-color:#8e7695;background:#fff;box-shadow:0 0 0 3px rgba(110,85,120,.08)}
.send{height:48px;border:0;border-radius:17px;background:#2b2530;color:#fff;padding:0 17px;font-weight:800}
.icon{width:48px;height:48px;flex:none;border:0;border-radius:17px;background:#f0ebf2;color:#403544;display:grid;place-items:center;font-size:24px}
#file{display:none}
#setup{position:fixed;inset:0;background:linear-gradient(145deg,rgba(35,27,39,.72),rgba(80,55,85,.76));backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.card{width:min(420px,100%);background:#fff;border-radius:28px;padding:27px 23px;box-shadow:0 25px 80px rgba(0,0,0,.28)}
.lock{width:58px;height:58px;border-radius:20px;background:#f0e9f2;display:grid;place-items:center;font-size:25px;margin-bottom:15px}
.card h2{margin:0;font-size:23px;letter-spacing:-.4px}.card p{color:#7d747f;font-size:14px;line-height:1.5;margin:7px 0 17px}
.card input{width:100%;height:52px;border:1px solid #ddd4e0;border-radius:16px;padding:0 15px;font-size:18px;outline:none;letter-spacing:4px;text-align:center}
.card input:focus{border-color:#7e6588;box-shadow:0 0 0 3px rgba(110,85,120,.09)}
.primary{width:100%;height:50px;border:0;border-radius:16px;background:#2b2530;color:#fff;font-weight:800;margin-top:11px}
.error{min-height:18px;color:#b04a5a;font-size:12px;text-align:center;margin-top:9px}
#nameBox{display:none}
#pinBox{display:block}
.hidden{display:none!important}
@media(max-width:600px){
 .app{max-width:none;box-shadow:none}
 header{padding-left:13px;padding-right:13px}
 #messages{padding:14px 9px 16px}
 .bubble{max-width:86%;padding:9px 12px}
 .msgtext{font-size:16px}
 .photo{max-height:300px}
 form{gap:7px;padding-left:8px;padding-right:8px}
 #text{height:50px;font-size:16px}
 .icon,.send{height:50px;border-radius:16px}
 .icon{width:50px}.send{padding:0 14px}
}
@media(max-width:360px){
 .send{font-size:0;width:50px;padding:0}.send::after{content:"➤";font-size:20px}
 .bubble{max-width:90%}
 .title{font-size:18px}
}
</style>
</head>
<body>

<div class="app" id="app">
<header>
  <div class="logo">K</div>
  <div class="head">
    <div class="title">Kiyimlar</div>
    <div class="sub" id="who">Kirish kutilmoqda...</div>
  </div>
  <button class="exit" id="logout" type="button" aria-label="Chiqish" title="Chiqish">↪</button>
</header>

<div id="messages"><div class="empty">Suhbatni boshlash uchun xabar yozing.</div></div>
<div id="status"></div>

<form id="form" autocomplete="off">
  <label class="icon" title="Rasm tanlash" aria-label="Rasm tanlash">＋
    <input id="file" type="file" accept="image/*">
  </label>
  <input id="text" type="text" placeholder="Xabar yozing..." autocomplete="off">
  <button class="send" type="submit">Yuborish</button>
</form>
</div>

<div id="setup">
  <div class="card">
    <div id="pinBox">
      <div class="lock">🔒</div>
      <h2>Kiyimlar</h2>
      <p>Kirish kodini kiriting.</p>
      <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" placeholder="••••••••" aria-label="Kirish kodi">
      <button class="primary" id="pinBtn" type="button">Kirish</button>
      <div class="error" id="pinError"></div>
    </div>

    <div id="nameBox">
      <div class="lock">👤</div>
      <h2>Ismingiz</h2>
      <p>Chatda ko‘rinadigan ismingizni kiriting.</p>
      <input id="name" maxlength="30" placeholder="Ismingiz" style="letter-spacing:0;text-align:left">
      <button class="primary" id="start" type="button">Chatga kirish</button>
      <div class="error" id="nameError"></div>
    </div>
  </div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getDatabase, ref, push, onChildAdded, query, limitToLast, remove} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAV7jDmCi89XU3-xLpk_WRU_mXbFcAK_qY",
  authDomain: "kiyimlar-olamiz-uz.firebaseapp.com",
  databaseURL: "https://kiyimlar-olamiz-uz-default-rtdb.firebaseio.com",
  projectId: "kiyimlar-olamiz-uz",
  storageBucket: "kiyimlar-olamiz-uz.firebasestorage.app",
  messagingSenderId: "721401033200",
  appId: "1:721401033200:web:d543e11684bfdb39fa2d35"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);
const roomId="bizning-suhbat-2026";
const ACCESS_CODE="09062004";

let me=localStorage.getItem("chatName")||"";
let listening=false;

const messages=document.querySelector("#messages");
const form=document.querySelector("#form");
const text=document.querySelector("#text");
const setup=document.querySelector("#setup");
const pin=document.querySelector("#pin");
const pinBtn=document.querySelector("#pinBtn");
const pinError=document.querySelector("#pinError");
const nameBox=document.querySelector("#nameBox");
const pinBox=document.querySelector("#pinBox");
const nameInput=document.querySelector("#name");
const start=document.querySelector("#start");
const nameError=document.querySelector("#nameError");
const who=document.querySelector("#who");
const status=document.querySelector("#status");
const logout=document.querySelector("#logout");

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function time(t){return new Date(t).toLocaleTimeString("uz-UZ",{hour:"2-digit",minute:"2-digit"});}

function render(m,key){
  const empty=messages.querySelector(".empty"); if(empty) empty.remove();
  if(document.querySelector(`[data-message-id="${key}"]`)) return;
  const mine=m.name===me;
  const d=document.createElement("div");
  d.className="msg "+(mine?"mine":"");
  d.dataset.messageId=key;
  const media=m.image?`<img class="photo" src="${m.image}" alt="Rasm" loading="lazy">`:"";
  const del=mine?`<button class="delete" type="button" data-delete="${key}">O‘chirish</button>`:"";
  d.innerHTML=`<div class="bubble"><div class="name">${esc(m.name)}</div>${m.text?`<div class="msgtext">${esc(m.text)}</div>`:""}${media}<div class="time">${time(m.createdAt)}</div>${del}</div>`;
  messages.appendChild(d);
  messages.scrollTop=messages.scrollHeight;
  if(mine){
    d.querySelector("[data-delete]").onclick=async()=>{
      if(!confirm("Bu xabarni o‘chirishni xohlaysizmi?")) return;
      status.textContent="O‘chirilmoqda...";
      try{
        await remove(ref(db,"rooms/"+roomId+"/messages/"+key));
        d.remove();
        if(!messages.querySelector(".msg")) messages.innerHTML='<div class="empty">Suhbatni boshlash uchun xabar yozing.</div>';
        status.textContent="";
      }catch(err){
        status.textContent="O‘chirishda xatolik: "+err.message;
      }
    };
  }
}

function connect(){
  if(listening)return;
  listening=true;
  who.textContent=`Siz: ${me}`;
  setup.classList.add("hidden");
  const q=query(ref(db,"rooms/"+roomId+"/messages"),limitToLast(100));
  onChildAdded(q,s=>render(s.val(),s.key),e=>{
    status.textContent="Ulanishda xatolik: "+e.message;
  });
  setTimeout(()=>text.focus(),150);
}

function unlock(){
  if(pin.value!==ACCESS_CODE){
    pinError.textContent="Kod noto‘g‘ri.";
    pin.value="";
    pin.focus();
    return;
  }
  sessionStorage.setItem("kiyimlarUnlocked","1");
  pinError.textContent="";
  pinBox.style.display="none";
  nameBox.style.display="block";
  nameInput.focus();
}

pinBtn.onclick=unlock;
pin.addEventListener("keydown",e=>{if(e.key==="Enter")unlock();});

start.onclick=()=>{
  const n=nameInput.value.trim();
  if(!n){nameError.textContent="Ismingizni kiriting.";return;}
  me=n;
  localStorage.setItem("chatName",me);
  connect();
};

logout.onclick=()=>{
  sessionStorage.removeItem("kiyimlarUnlocked");
  location.reload();
};

async function imageData(file){
  if(!file.type.startsWith("image/"))throw new Error("Rasm emas");
  const img=new Image(), url=URL.createObjectURL(file);
  await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});
  const max=900, scale=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement("canvas");
  c.width=Math.max(1,Math.round(img.width*scale));
  c.height=Math.max(1,Math.round(img.height*scale));
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  URL.revokeObjectURL(url);
  return c.toDataURL("image/jpeg",.78);
}

async function send(textValue,image){
  if(!me)return;
  await push(ref(db,"rooms/"+roomId+"/messages"),{
    name:me,text:textValue||"",image:image||"",createdAt:Date.now()
  });
}

form.onsubmit=async e=>{
  e.preventDefault();
  const v=text.value.trim();
  if(!v)return;
  text.value="";
  status.textContent="Yuborilmoqda...";
  try{await send(v,"");status.textContent=""}
  catch(err){status.textContent="Xatolik: "+err.message}
  text.focus();
};

document.querySelector("#file").onchange=async e=>{
  const f=e.target.files[0]; if(!f)return;
  status.textContent="Rasm tayyorlanmoqda...";
  try{const data=await imageData(f);await send("",data);status.textContent=""}
  catch(err){status.textContent="Rasm yuborilmadi. Kichikroq rasm tanlang."}
  e.target.value="";
};

if(sessionStorage.getItem("kiyimlarUnlocked")==="1"){
  pinBox.style.display="none";
  nameBox.style.display="block";
  if(me) connect();
}else{
  setup.classList.remove("hidden");
  pin.focus();
}
</script>
</body>
</html>
