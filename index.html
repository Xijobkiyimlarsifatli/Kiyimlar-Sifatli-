<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Toper.uz — Chat</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f4f6fb;color:#172033;height:100vh;overflow:hidden}
button,input{font:inherit}
.hidden{display:none!important}

#loginScreen{height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#6c5ce7,#8e7cf5)}
.loginBox{width:100%;max-width:390px;background:#fff;border-radius:24px;padding:30px 24px;box-shadow:0 18px 50px #0002;text-align:center}
.logo{width:68px;height:68px;border-radius:20px;background:#6c5ce7;color:#fff;display:grid;place-items:center;font-size:30px;font-weight:800;margin:0 auto 16px}
.loginBox h1{font-size:28px;margin-bottom:8px}
.loginBox p{color:#778097;margin-bottom:24px}
.loginBox input{width:100%;height:52px;border:1px solid #dfe3ec;border-radius:14px;padding:0 16px;outline:none;margin-bottom:12px}
.loginBox input:focus{border-color:#6c5ce7}
.primary{width:100%;height:52px;border:0;border-radius:14px;background:#6c5ce7;color:white;font-weight:700;cursor:pointer}
.error{color:#e5484d;font-size:14px;min-height:20px;margin:4px 0 8px}

#chatScreen{height:100vh;display:flex;flex-direction:column;max-width:900px;margin:auto;background:#fff}
.header{height:68px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #edf0f5;background:#fff}
.brand{display:flex;align-items:center;gap:11px}
.brandIcon{width:42px;height:42px;border-radius:13px;background:#6c5ce7;color:#fff;display:grid;place-items:center;font-weight:800}
.brandText b{display:block;font-size:17px}.brandText span{font-size:12px;color:#8a92a5}
.logout{border:0;background:#f1f2f7;color:#555e72;border-radius:11px;padding:9px 12px;cursor:pointer}
.messages{flex:1;overflow-y:auto;padding:18px 14px;background:#f7f8fc}
.day{text-align:center;color:#8b93a5;font-size:12px;margin:8px 0 16px}
.msgRow{display:flex;margin-bottom:10px}
.msgRow.mine{justify-content:flex-end}
.bubble{max-width:min(78%,520px);padding:10px 12px;border-radius:17px;background:#fff;box-shadow:0 2px 8px #1720330b;position:relative}
.mine .bubble{background:#6c5ce7;color:#fff;border-bottom-right-radius:5px}
.other .bubble{border-bottom-left-radius:5px}
.name{font-size:11px;font-weight:700;color:#6c5ce7;margin-bottom:4px}
.mine .name{color:#eee}
.text{white-space:pre-wrap;word-break:break-word;line-height:1.4;font-size:15px}
.time{font-size:10px;color:#98a0b1;text-align:right;margin-top:4px}
.mine .time{color:#ddd}
.photo{display:block;max-width:260px;max-height:320px;border-radius:12px;cursor:pointer;margin-bottom:5px}
.actions{margin-top:6px;display:flex;justify-content:flex-end}
.deleteBtn{border:0;background:transparent;color:#8b93a5;font-size:11px;cursor:pointer}
.mine .deleteBtn{color:#eee}
.empty{text-align:center;color:#9aa2b3;padding-top:20vh;font-size:14px}
.composer{flex:none;display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #edf0f5;background:#fff}
.composer input[type=text]{flex:1;min-width:0;height:46px;border:1px solid #dfe3ec;border-radius:14px;padding:0 14px;outline:none}
.composer input[type=text]:focus{border-color:#6c5ce7}
.iconBtn{width:46px;height:46px;border:0;border-radius:14px;background:#f0f1f7;cursor:pointer}
.send{background:#6c5ce7;color:#fff;font-size:18px}
.footer{text-align:center;color:#a0a7b6;font-size:11px;padding:0 0 5px;background:#fff}

.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modalBox{background:#fff;border-radius:18px;padding:22px;max-width:330px;width:100%;text-align:center}
.modalBox h3{margin-bottom:10px}.modalBox p{color:#70798c;font-size:14px;margin-bottom:18px}
.modalBtns{display:flex;gap:8px}.modalBtns button{flex:1;height:44px;border:0;border-radius:12px;cursor:pointer}
.cancel{background:#eef0f5}.danger{background:#e5484d;color:#fff}
.imageModal img{max-width:95vw;max-height:85vh;border-radius:14px}

@media(max-width:600px){
 .loginBox{padding:26px 20px;border-radius:20px}
 .header{height:62px}
 .bubble{max-width:84%}
 .photo{max-width:220px}
}
</style>
</head>
<body>

<section id="loginScreen">
  <div class="loginBox">
    <div class="logo">T</div>
    <h1>Toper.uz</h1>
    <p id="loginText">Kiyimlar Sotib Olish</p>

    <div id="pinStep">
      <input id="pinInput" type="password" inputmode="numeric" maxlength="4" placeholder="4 xonali kod">
      <div id="pinError" class="error"></div>
      <button class="primary" id="pinBtn">Kirish</button>
    </div>

    <div id="nameStep" class="hidden">
      <input id="nameInput" type="text" maxlength="30" placeholder="Ismingiz">
      <div id="nameError" class="error"></div>
      <button class="primary" id="nameBtn">Chatga kirish</button>
    </div>
  </div>
</section>

<section id="chatScreen" class="hidden">
  <header class="header">
    <div class="brand">
      <div class="brandIcon">T</div>
      <div class="brandText"><b>Toper.uz</b><span>Bizning suhbat</span></div>
    </div>
    <button class="logout" id="logoutBtn">Chiqish</button>
  </header>

  <main id="messages" class="messages">
    <div id="empty" class="empty">Hozircha xabar yo‘q</div>
  </main>

  <div class="composer">
    <label class="iconBtn" style="display:grid;place-items:center;cursor:pointer">
      📷
      <input id="imageInput" type="file" accept="image/*" hidden>
    </label>
    <input id="messageInput" type="text" placeholder="Xabar yozing..." autocomplete="off">
    <button class="iconBtn send" id="sendBtn">➤</button>
  </div>
  <div class="footer">Murodjon yaratgan ♥</div>
</section>

<div id="deleteModal" class="modal hidden">
  <div class="modalBox">
    <h3>Xabarni o‘chirasizmi?</h3>
    <p>Bu xabar chatdan butunlay o‘chiriladi.</p>
    <div class="modalBtns">
      <button class="cancel" id="cancelDelete">Bekor qilish</button>
      <button class="danger" id="confirmDelete">O‘chirish</button>
    </div>
  </div>
</div>

<div id="imageModal" class="modal imageModal hidden">
  <img id="bigImage" src="" alt="Rasm">
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
  getDatabase, ref, push, onValue, remove
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAV7jDmCi89XU3-xLpk_WRU_mXbFcAK_qY",
  authDomain: "kiyimlar-olamiz-uz.firebaseapp.com",
  databaseURL: "https://kiyimlar-olamiz-uz-default-rtdb.firebaseio.com",
  projectId: "kiyimlar-olamiz-uz",
  storageBucket: "kiyimlar-olamiz-uz.firebasestorage.app",
  messagingSenderId: "721401033200",
  appId: "1:721401033200:web:d543e11684bfdb39fa2d35"
};

const ACCESS_CODE = "0906";
const ONE_HOUR = 60 * 60 * 1000;
const ROOM = "bizning-suhbat-2026";
const MESSAGES_PATH = `rooms/${ROOM}/messages`;

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const messagesRef = ref(db, MESSAGES_PATH);

const loginScreen = document.getElementById("loginScreen");
const chatScreen = document.getElementById("chatScreen");
const pinStep = document.getElementById("pinStep");
const nameStep = document.getElementById("nameStep");
const pinInput = document.getElementById("pinInput");
const nameInput = document.getElementById("nameInput");
const pinError = document.getElementById("pinError");
const nameError = document.getElementById("nameError");
const messagesBox = document.getElementById("messages");
const empty = document.getElementById("empty");
const messageInput = document.getElementById("messageInput");
const imageInput = document.getElementById("imageInput");

let currentUsername = "";
let pendingDelete = null;
let messagesCache = {};

function normalizeMessage(id, m) {
  return {
    id,
    author: m?.author ?? m?.sender ?? "",
    timestamp: Number(m?.timestamp ?? m?.createdAt ?? 0),
    text: m?.text ?? "",
    image: m?.image ?? ""
  };
}

function showPin() {
  loginScreen.classList.remove("hidden");
  chatScreen.classList.add("hidden");
  pinStep.classList.remove("hidden");
  nameStep.classList.add("hidden");
  pinInput.value = "";
  pinError.textContent = "";
  setTimeout(() => pinInput.focus(), 100);
}

function enterChat() {
  loginScreen.classList.add("hidden");
  chatScreen.classList.remove("hidden");
  messageInput.focus();
}

function showName() {
  pinStep.classList.add("hidden");
  nameStep.classList.remove("hidden");
  nameInput.focus();
}

function loginWithPin() {
  if (pinInput.value !== ACCESS_CODE) {
    pinError.textContent = "Kod noto‘g‘ri. Faqat 0906 kiriting.";
    pinInput.value = "";
    pinInput.focus();
    return;
  }
  pinError.textContent = "";
  sessionStorage.setItem("toper_unlocked", "1");

  const saved = localStorage.getItem("toper_username");
  if (saved) {
    currentUsername = saved;
    enterChat();
  } else {
    showName();
  }
}

function loginWithName() {
  const name = nameInput.value.trim();
  if (name.length < 2) {
    nameError.textContent = "Ism kamida 2 ta belgidan iborat bo‘lsin.";
    return;
  }
  currentUsername = name;
  localStorage.setItem("toper_username", name);
  enterChat();
}

document.getElementById("pinBtn").onclick = loginWithPin;
document.getElementById("nameBtn").onclick = loginWithName;

pinInput.addEventListener("keydown", e => {
  if (e.key === "Enter") loginWithPin();
});
nameInput.addEventListener("keydown", e => {
  if (e.key === "Enter") loginWithName();
});
messageInput.addEventListener("keydown", e => {
  if (e.key === "Enter") sendMessage();
});

function formatTime(ts) {
  return new Date(ts).toLocaleTimeString("uz-UZ", {
    hour: "2-digit", minute: "2-digit"
  });
}

function renderMessages(data) {
  messagesCache = data || {};
  messagesBox.innerHTML = "";
  const list = Object.entries(messagesCache)
    .map(([id,m]) => normalizeMessage(id,m))
    .filter(m => m.timestamp > 0 && Date.now() - m.timestamp <= ONE_HOUR)
    .sort((a,b) => a.timestamp - b.timestamp);

  if (!list.length) {
    messagesBox.appendChild(empty);
    return;
  }

  for (const msg of list) {
    const mine = msg.author === currentUsername;
    const row = document.createElement("div");
    row.className = "msgRow " + (mine ? "mine" : "other");

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    if (!mine && msg.author) {
      const n = document.createElement("div");
      n.className = "name";
      n.textContent = msg.author;
      bubble.appendChild(n);
    }

    if (msg.image) {
      const img = document.createElement("img");
      img.className = "photo";
      img.src = msg.image;
      img.alt = "Rasm";
      img.onclick = () => {
        document.getElementById("bigImage").src = msg.image;
        document.getElementById("imageModal").classList.remove("hidden");
      };
      bubble.appendChild(img);
    }

    if (msg.text) {
      const text = document.createElement("div");
      text.className = "text";
      text.textContent = msg.text;
      bubble.appendChild(text);
    }

    const time = document.createElement("div");
    time.className = "time";
    time.textContent = formatTime(msg.timestamp);
    bubble.appendChild(time);

    if (mine) {
      const actions = document.createElement("div");
      actions.className = "actions";
      const del = document.createElement("button");
      del.className = "deleteBtn";
      del.textContent = "O‘chirish";
      del.onclick = () => openDelete(msg.id);
      actions.appendChild(del);
      bubble.appendChild(actions);
    }

    row.appendChild(bubble);
    messagesBox.appendChild(row);
  }

  messagesBox.scrollTop = messagesBox.scrollHeight;
}

onValue(messagesRef, snapshot => {
  renderMessages(snapshot.val());
}, error => {
  console.error(error);
  messagesBox.innerHTML = '<div class="empty">Chatga ulanishda xatolik yuz berdi.</div>';
});

async function cleanupExpired() {
  const now = Date.now();
  for (const [id, raw] of Object.entries(messagesCache)) {
    const msg = normalizeMessage(id, raw);
    if (msg.timestamp && now - msg.timestamp > ONE_HOUR) {
      try {
        await remove(ref(db, `${MESSAGES_PATH}/${id}`));
      } catch(e) {
        console.error("O‘chirish xatosi:", e);
      }
    }
  }
}
setInterval(cleanupExpired, 60 * 1000);

async function sendMessage() {
  const text = messageInput.value.trim();
  const file = imageInput.files[0];

  if (!text && !file) return;

  let image = "";
  if (file) {
    if (file.size > 4 * 1024 * 1024) {
      alert("Rasm 4 MB dan kichik bo‘lsin.");
      return;
    }
    image = await fileToDataURL(file);
  }

  try {
    await push(messagesRef, {
      author: currentUsername,
      timestamp: Date.now(),
      text: text || null,
      image: image || null
    });
    messageInput.value = "";
    imageInput.value = "";
    messageInput.focus();
  } catch(e) {
    alert("Xabar yuborilmadi. Firebase ulanishini tekshiring.");
    console.error(e);
  }
}

function fileToDataURL(file) {
  return new Promise((resolve,reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

document.getElementById("sendBtn").onclick = sendMessage;

function openDelete(id) {
  pendingDelete = id;
  document.getElementById("deleteModal").classList.remove("hidden");
}
document.getElementById("cancelDelete").onclick = () => {
  pendingDelete = null;
  document.getElementById("deleteModal").classList.add("hidden");
};
document.getElementById("confirmDelete").onclick = async () => {
  if (!pendingDelete) return;
  try {
    const msg = normalizeMessage(pendingDelete, messagesCache[pendingDelete]);
    if (msg.author !== currentUsername) {
      alert("Faqat o‘zingiz yuborgan xabarni o‘chira olasiz.");
    } else {
      await remove(ref(db, `${MESSAGES_PATH}/${pendingDelete}`));
    }
  } catch(e) {
    console.error(e);
    alert("Xabarni o‘chirishda xatolik.");
  }
  pendingDelete = null;
  document.getElementById("deleteModal").classList.add("hidden");
};

document.getElementById("imageModal").onclick = () => {
  document.getElementById("imageModal").classList.add("hidden");
};

document.getElementById("logoutBtn").onclick = () => {
  sessionStorage.removeItem("toper_unlocked");
  currentUsername = "";
  showPin();
};

window.addEventListener("load", () => {
  // Har safar yangi sahifa ochilganda PIN so‘raladi.
  sessionStorage.removeItem("toper_unlocked");
  showPin();
});
</script>
</body>
</html>
